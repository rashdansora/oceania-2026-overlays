<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oceania 2026 Stream - Deadlift Standings</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

    :root {
      --bg-dark: #061325;
      --bg-card: #0b1d3a;
      --bg-ice: #dbeafe;
      --cyan-primary: #00b4d8;
      --cyan-bright: #38bdf8;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --good-green: #16a34a;
      --no-lift-red: #dc2626;
      --pa-gold: #f59e0b;
      --first-place-bg: rgba(245, 158, 11, 0.15);
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      margin: 0; padding: 0;
      width: 1920px; height: 1080px;
      background: transparent;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden; position: relative;
      -webkit-font-smoothing: antialiased;
    }

    .leaderboard-card {
      position: absolute; top: 60px; bottom: 60px; right: 60px;
      width: 1248px; height: calc(1080px - 120px);
      background: var(--bg-dark);
      border: 2px solid rgba(0, 180, 216, 0.5);
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
      overflow: hidden; display: flex; flex-direction: column;
    }

    .lb-header {
      background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-card) 100%);
      padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 3px solid var(--cyan-primary); flex-shrink: 0;
    }

    .lb-title-group { display: flex; align-items: center; gap: 15px; }

    .lb-logo-badge {
      background: var(--cyan-primary); color: var(--bg-dark);
      font-weight: 900; font-size: 22px; padding: 6px 16px; border-radius: 4px; letter-spacing: -1px;
    }

    .lb-title { color: var(--text-white); font-size: 26px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }

    .lb-meta-group { display: flex; align-items: center; gap: 15px; }

    .page-badge {
      background: rgba(0, 180, 216, 0.2); border: 1px solid var(--cyan-primary);
      color: var(--cyan-bright); font-size: 14px; font-weight: 900; padding: 5px 14px; border-radius: 12px; letter-spacing: 0.5px;
    }

    .lb-subtitle { color: var(--cyan-bright); font-size: 15px; font-weight: 800; letter-spacing: 0.5px; }

    .category-divider {
      background: linear-gradient(90deg, rgba(0, 180, 216, 0.3) 0%, rgba(11, 29, 58, 0.8) 100%);
      color: var(--cyan-bright); font-size: 15px; font-weight: 900; padding: 10px 30px;
      letter-spacing: 1px; border-top: 1px solid rgba(0, 180, 216, 0.4); border-bottom: 1px solid rgba(0, 180, 216, 0.4);
      text-transform: uppercase; flex-shrink: 0;
    }

    .lb-table-header {
      display: grid; grid-template-columns: 55px 75px 1fr 90px 90px 90px 110px 100px;
      padding: 12px 30px; background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); color: var(--cyan-bright);
      font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; align-items: center; flex-shrink: 0;
    }

    .col-center { text-align: center; }
    .col-right { text-align: right; }

    .lb-rows-container { display: flex; flex-direction: column; flex: 1; opacity: 1; transition: opacity 0.35s ease-in-out; overflow: hidden; }
    .lb-rows-container.fading { opacity: 0; }

    .lb-row {
      display: grid; grid-template-columns: 55px 75px 1fr 90px 90px 90px 110px 100px;
      padding: 12px 30px; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-white); font-weight: 800;
    }

    .lb-row:nth-child(even) { background: rgba(255, 255, 255, 0.015); }
    .lb-row.rank-1 { background: var(--first-place-bg); border-left: 4px solid var(--pa-gold); }

    .rank-badge { font-size: 21px; font-weight: 900; color: var(--text-muted); text-align: center; }
    .lb-row.rank-1 .rank-badge { color: var(--pa-gold); }

    .nation-col { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; }
    .flag-badge { width: 24px; height: 16px; border-radius: 2px; object-fit: cover; border: 1px solid rgba(255, 255, 255, 0.2); }
    .lifter-name { font-size: 21px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .att-pill-cell { display: flex; align-items: center; justify-content: center; }
    .att-badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 4px 6px; border-radius: 4px; font-weight: 900; font-size: 21px; width: 75px; text-align: center;
      letter-spacing: -0.5px;
    }
    .att-badge.good {
      background: var(--good-green); color: #ffffff; box-shadow: none; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .att-badge.no-lift {
      background: var(--no-lift-red); color: #ffffff; box-shadow: none; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .att-badge.pending { background: rgba(255, 255, 255, 0.08); color: var(--text-white); }
    .att-badge.empty { color: var(--text-muted); }

    .total-val { font-size: 21px; font-weight: 900; color: var(--pa-gold); text-align: right; }
    .wilks-val { font-size: 21px; font-weight: 900; color: var(--text-white); text-align: right; }
  </style>
</head>
<body>

  <div class="leaderboard-card">
    <div class="lb-header">
      <div class="lb-title-group">
        <div class="lb-logo-badge">DEAD</div>
        <div class="lb-title">DEADLIFT STANDINGS</div>
      </div>
      <div class="lb-meta-group">
        <div class="page-badge" id="pageBadge">PAGE 1 / 1</div>
        <div class="lb-subtitle">WORLDPOWERLIFTING</div>
      </div>
    </div>

    <div class="lb-table-header">
      <div class="col-center">RANK</div>
      <div class="col-center">NAT</div>
      <div>ATHLETE</div>
      <div class="col-center">DEADLIFT 1</div>
      <div class="col-center">DEADLIFT 2</div>
      <div class="col-center">DEADLIFT 3</div>
      <div class="col-right">BEST DEADLIFT</div>
      <div class="col-right">WILKS</div>
    </div>

    <div class="lb-rows-container" id="rowsContainer"></div>
  </div>

  <script>
    const rowsContainer = document.getElementById('rowsContainer');
    const pageBadge = document.getElementById('pageBadge');
    const LIFTERS_PER_PAGE = 10;
    const PAGE_CYCLE_MS = 7000;

    let cachedStandings = [];
    let currentPage = 0;
    let pageTimer = null;

    const countryDb = [
      { code3: 'SRI', iso2: 'lk', names: ['SRI', 'LK', 'SRI LANKA'] },
      { code3: 'PAK', iso2: 'pk', names: ['PAK', 'PK', 'PAKISTAN'] },
      { code3: 'IND', iso2: 'in', names: ['IND', 'IN', 'INDIA'] },
      { code3: 'AUS', iso2: 'au', names: ['AUS', 'AU', 'AUSTRALIA'] },
      { code3: 'NZL', iso2: 'nz', names: ['NZL', 'NZ', 'NEW ZEALAND'] },
      { code3: 'NRU', iso2: 'nr', names: ['NRU', 'NR', 'NAURU'] },
      { code3: 'FIJ', iso2: 'fj', names: ['FIJ', 'FJ', 'FIJI'] },
      { code3: 'SAM', iso2: 'ws', names: ['SAM', 'WS', 'SAMOA', 'WESTERN SAMOA'] },
      { code3: 'TGA', iso2: 'to', names: ['TGA', 'TO', 'TONGA'] },
      { code3: 'PNG', iso2: 'pg', names: ['PNG', 'PG', 'PAPUA NEW GUINEA'] },
      { code3: 'SOL', iso2: 'sb', names: ['SOL', 'SB', 'SOLOMON ISLANDS'] },
      { code3: 'VAN', iso2: 'vu', names: ['VAN', 'VU', 'VANUATU'] },
      { code3: 'GBR', iso2: 'gb', names: ['GBR', 'GB', 'GREAT BRITAIN', 'UK'] },
      { code3: 'USA', iso2: 'us', names: ['USA', 'US', 'UNITED STATES'] }
    ];

    function normalizeCountry(rawInput) {
      if (!rawInput || rawInput === '-') return { code3: '---', iso2: null };
      const clean = rawInput.toString().trim().toUpperCase();
      const match = countryDb.find(c => c.names.includes(clean));
      if (match) return { code3: match.code3, iso2: match.iso2 };
      if (clean.length === 3) return { code3: clean, iso2: clean.toLowerCase() };
      return { code3: clean.substring(0, 3), iso2: null };
    }

    function buildCategoryBlocks(standings) {
      const grouped = {};
      standings.forEach(l => {
        const gender = l.gender || 'MEN';
        const wc = l.weightClass && l.weightClass !== '-' ? l.weightClass : 'OPEN CATEGORY';
        const groupKey = `${gender}'S ${wc}`;
        if (!grouped[groupKey]) grouped[groupKey] = [];
        grouped[groupKey].push(l);
      });

      const blocks = [];
      Object.keys(grouped).forEach(groupKey => {
        const categoryLifters = grouped[groupKey];
        categoryLifters.sort((a, b) => (parseFloat(b.bestDead) || 0) - (parseFloat(a.bestDead) || 0));

        categoryLifters.forEach((l, idx) => {
          blocks.push({ type: 'row', data: l, rank: idx + 1, category: groupKey });
        });
      });
      return blocks;
    }

    function formatPillBadge(att) {
      if (!att || att.val === '-' || att.status === 'empty') {
        return `<div class="att-pill-cell"><span class="att-badge empty">-</span></div>`;
      }
      return `<div class="att-pill-cell"><span class="att-badge ${att.status}">${att.val}</span></div>`;
    }

    function renderCurrentPage() {
      if (!cachedStandings || cachedStandings.length === 0) return;

      const blocks = buildCategoryBlocks(cachedStandings);
      const totalPages = Math.max(1, Math.ceil(blocks.length / LIFTERS_PER_PAGE));
      if (currentPage >= totalPages) currentPage = 0;

      pageBadge.textContent = `PAGE ${currentPage + 1} / ${totalPages}`;
      const startIndex = currentPage * LIFTERS_PER_PAGE;
      const pageBlocks = blocks.slice(startIndex, startIndex + LIFTERS_PER_PAGE);

      rowsContainer.classList.add('fading');

      setTimeout(() => {
        rowsContainer.innerHTML = '';
        let lastRenderedCat = '';

        pageBlocks.forEach(item => {
          if (item.category !== lastRenderedCat) {
            lastRenderedCat = item.category;
            const categoryBanner = document.createElement('div');
            categoryBanner.className = 'category-divider';
            categoryBanner.textContent = `DIVISION: ${item.category}`;
            rowsContainer.appendChild(categoryBanner);
          }

          const l = item.data;
          const rank = item.rank;
          const norm = normalizeCountry(l.country);

          const row = document.createElement('div');
          row.className = `lb-row ${rank === 1 ? 'rank-1' : ''}`;

          const flagHtml = norm.iso2 
            ? `<img class="flag-badge" src="https://flagcdn.com/w80/${norm.iso2}.png" onerror="this.style.display='none'" />`
            : '';

          const atts = l.deadAtts || [{val:'-'},{val:'-'},{val:'-'}];

          row.innerHTML = `
            <div class="rank-badge">${rank}</div>
            <div class="nation-col">${flagHtml}<span>${norm.code3}</span></div>
            <div class="lifter-name">${l.name}</div>
            ${formatPillBadge(atts[0])}
            ${formatPillBadge(atts[1])}
            ${formatPillBadge(atts[2])}
            <div class="total-val">${l.bestDead !== '-' ? l.bestDead + 'kg' : '-'}</div>
            <div class="wilks-val">${l.points !== '-' ? l.points : '-'}</div>
          `;

          rowsContainer.appendChild(row);
        });

        rowsContainer.classList.remove('fading');
      }, 350);
    }

    function startAutoPaging() {
      if (pageTimer) clearInterval(pageTimer);
      pageTimer = setInterval(() => {
        if (!cachedStandings || cachedStandings.length <= LIFTERS_PER_PAGE) {
          currentPage = 0;
          return;
        }
        currentPage++;
        renderCurrentPage();
      }, PAGE_CYCLE_MS);
    }

    const peer = new Peer('openlifter-obs-lb-dead-sora');
    peer.on('connection', (conn) => {
      conn.on('data', (d) => {
        if (d && d.standings) {
          cachedStandings = d.standings;
          renderCurrentPage();
        }
      });
    });

    startAutoPaging();
  </script>
</body>
</html>
