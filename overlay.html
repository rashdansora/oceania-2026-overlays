<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oceania 2026 Stream - Athlete Lower Third Overlay</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

    :root {
      --bg-dark: #061325;
      --bg-card: #0b1d3a;
      --cyan-primary: #00b4d8;
      --cyan-bright: #38bdf8;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --good-green: #16a34a;
      --no-lift-red: #dc2626;
      --active-gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      background: transparent;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    .overlay-card {
      position: absolute;
      bottom: 60px;
      left: 60px;
      width: 820px;
      background: var(--bg-dark);
      border: 2px solid rgba(0, 180, 216, 0.5);
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
      overflow: visible;
      display: flex;
      flex-direction: column;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* Ref Decision Badge Floating Header */
    .ref-lights-container {
      position: absolute;
      top: -58px;
      right: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      opacity: 0;
      transform: translateY(10px) scale(0.95);
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      z-index: 100;
    }

    .ref-lights-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .ref-badge {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
      transition: all 0.2s ease;
    }

    .ref-badge.white {
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #ffffff;
    }

    .ref-badge.red {
      border-radius: 8px;
      background: #dc2626;
      border: 2px solid #ef4444;
      border-bottom: 5px solid #991b1b;
    }

    .card-header {
      background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-card) 100%);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--cyan-primary);
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }

    .lifter-info-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .flag-badge {
      width: 36px;
      height: 24px;
      border-radius: 3px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .lifter-name {
      color: var(--text-white);
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 480px;
    }

    .meta-badge {
      background: rgba(0, 180, 216, 0.15);
      border: 1px solid var(--cyan-primary);
      color: var(--cyan-bright);
      font-size: 15px;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .card-body {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 29, 58, 0.4);
    }

    .discipline-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .discipline-label {
      color: var(--cyan-bright);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .discipline-title {
      color: var(--text-white);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .attempts-container {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .att-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 85px;
      height: 44px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 21px;
      letter-spacing: -0.5px;
      color: var(--text-white);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .att-badge.good {
      background: var(--good-green);
      color: #ffffff;
      border: none;
      box-shadow: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .att-badge.no-lift {
      background: var(--no-lift-red);
      color: #ffffff;
      border: none;
      box-shadow: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .att-badge.active {
      background: var(--active-gold);
      color: #061325;
      border: none;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
    }

    .card-footer {
      background: rgba(6, 19, 37, 0.8);
      padding: 12px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
    }

    .subtotal-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subtotal-label {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 800;
    }

    .subtotal-val {
      color: var(--text-white);
      font-size: 18px;
      font-weight: 900;
    }

    .status-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    .status-dot.connected {
      background: #22c55e;
    }
  </style>
</head>
<body>

  <div class="overlay-card" id="overlayCard">
    <div class="status-dot" id="statusDot" title="PeerJS Connection Status"></div>

    <!-- Referee Decision Badge Container -->
    <div class="ref-lights-container" id="refLightsContainer">
      <div class="ref-badge" id="refBadge1"></div>
      <div class="ref-badge" id="refBadge2"></div>
      <div class="ref-badge" id="refBadge3"></div>
    </div>

    <div class="card-header">
      <div class="lifter-info-group">
        <img class="flag-badge" id="flagImg" src="" style="display: none;" alt="Nation Flag" />
        <div class="lifter-name" id="lifterName">WAITING FOR DATA...</div>
      </div>
      <div class="meta-badge" id="metaBadge">OPEN</div>
    </div>

    <div class="card-body">
      <div class="discipline-group">
        <div class="discipline-label">ACTIVE MOVEMENT</div>
        <div class="discipline-title" id="discTitle">SQUAT</div>
      </div>

      <div class="attempts-container">
        <div class="att-badge" id="att1">-</div>
        <div class="att-badge" id="att2">-</div>
        <div class="att-badge" id="att3">-</div>
      </div>
    </div>

    <div class="card-footer">
      <div class="subtotal-item">
        <span class="subtotal-label">SQ:</span>
        <span class="subtotal-val" id="subS">-</span>
      </div>
      <div class="subtotal-item">
        <span class="subtotal-label">BP:</span>
        <span class="subtotal-val" id="subB">-</span>
      </div>
      <div class="subtotal-item">
        <span class="subtotal-label">DL:</span>
        <span class="subtotal-val" id="subD">-</span>
      </div>
    </div>
  </div>

  <script>
    const elName = document.getElementById('lifterName');
    const elMeta = document.getElementById('metaBadge');
    const elDisc = document.getElementById('discTitle');
    const elFlag = document.getElementById('flagImg');
    const elDot = document.getElementById('statusDot');

    const elAtt1 = document.getElementById('att1');
    const elAtt2 = document.getElementById('att2');
    const elAtt3 = document.getElementById('att3');

    const elSubS = document.getElementById('subS');
    const elSubB = document.getElementById('subB');
    const elSubD = document.getElementById('subD');

    const refContainer = document.getElementById('refLightsContainer');
    const refBadges = [
      document.getElementById('refBadge1'),
      document.getElementById('refBadge2'),
      document.getElementById('refBadge3')
    ];

    const iconCheck = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    const iconCross = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;

    const countryDb = [
      { code3: 'SRI', iso2: 'lk', names: ['SRI', 'LK', 'SRI LANKA'] },
      { code3: 'PAK', iso2: 'pk', names: ['PAK', 'PK', 'PAKISTAN'] },
      { code3: 'IND', iso2: 'in', names: ['IND', 'IN', 'INDIA'] },
      { code3: 'AUS', iso2: 'au', names: ['AUS', 'AU', 'AUSTRALIA'] },
      { code3: 'NZL', iso2: 'nz', names: ['NZL', 'NZ', 'NEW ZEALAND'] },
      { code3: 'NRU', iso2: 'nr', names: ['NRU', 'NR', 'NAURU'] },
      { code3: 'FIJ', iso2: 'fj', names: ['FIJ', 'FJ', 'FIJI'] },
      { code3: 'SAM', iso2: 'ws', names: ['SAM', 'WS', 'SAMOA', 'WESTERN SAMOA'] },
      { code3: 'TGA', iso2: 'to', names: ['TGA', 'TO', 'TONGA'] },
      { code3: 'PNG', iso2: 'pg', names: ['PNG', 'PG', 'PAPUA NEW GUINEA'] },
      { code3: 'SOL', iso2: 'sb', names: ['SOL', 'SB', 'SOLOMON ISLANDS'] },
      { code3: 'VAN', iso2: 'vu', names: ['VAN', 'VU', 'VANUATU'] },
      { code3: 'GBR', iso2: 'gb', names: ['GBR', 'GB', 'GREAT BRITAIN', 'UK'] },
      { code3: 'USA', iso2: 'us', names: ['USA', 'US', 'UNITED STATES'] }
    ];

    function normalizeCountry(rawInput) {
      if (!rawInput || rawInput === '-') return { code3: '', iso2: null };
      const clean = rawInput.toString().trim().toUpperCase();
      const match = countryDb.find(c => c.names.includes(clean));
      if (match) return { code3: match.code3, iso2: match.iso2 };
      if (clean.length === 3) return { code3: clean, iso2: clean.toLowerCase() };
      return { code3: clean.substring(0, 3), iso2: null };
    }

    function renderPill(element, attemptData) {
      if (!attemptData || !attemptData.val || attemptData.val === '-') {
        element.textContent = '-';
        element.className = 'att-badge';
        return;
      }

      element.textContent = attemptData.val.includes('kg') ? attemptData.val : `${attemptData.val}kg`;
      
      if (attemptData.status === 'good') {
        element.className = 'att-badge good';
      } else if (attemptData.status === 'no-lift') {
        element.className = 'att-badge no-lift';
      } else if (attemptData.status === 'active') {
        element.className = 'att-badge active';
      } else {
        element.className = 'att-badge';
      }
    }

    function updateRefLights(lights) {
      if (!Array.isArray(lights) || lights.length !== 3) {
        refContainer.classList.remove('visible');
        return;
      }

      // Check if ALL THREE lights are non-'off'
      const allSelected = lights.every(l => l === 'white' || l === 'red');

      if (!allSelected) {
        refContainer.classList.remove('visible');
        return;
      }

      lights.forEach((state, i) => {
        if (state === 'white') {
          refBadges[i].className = 'ref-badge white';
          refBadges[i].innerHTML = iconCheck;
        } else if (state === 'red') {
          refBadges[i].className = 'ref-badge red';
          refBadges[i].innerHTML = iconCross;
        }
      });

      refContainer.classList.add('visible');
    }

    function updateOverlayData(data) {
      if (!data) return;

      if (data.name) elName.textContent = data.name;

      if (data.country !== undefined) {
        const norm = normalizeCountry(data.country);
        if (norm.iso2) {
          elFlag.src = `https://flagcdn.com/w80/${norm.iso2}.png`;
          elFlag.style.display = 'block';
        } else {
          elFlag.style.display = 'none';
        }
      }

      const wc = data.weightClass && data.weightClass !== '-' ? data.weightClass : '';
      const div = data.division && data.division !== '-' ? data.division : 'OPEN';
      elMeta.textContent = wc ? `${div} · ${wc}` : div;

      if (data.discipline === 'S') elDisc.textContent = 'SQUAT';
      else if (data.discipline === 'B') elDisc.textContent = 'BENCH PRESS';
      else if (data.discipline === 'D') elDisc.textContent = 'DEADLIFT';

      if (data.attempts && data.attempts.length >= 3) {
        renderPill(elAtt1, data.attempts[0]);
        renderPill(elAtt2, data.attempts[1]);
        renderPill(elAtt3, data.attempts[2]);
      }

      if (data.subtotals) {
        elSubS.textContent = data.subtotals.S !== '-' ? `${data.subtotals.S}kg` : '-';
        elSubB.textContent = data.subtotals.B !== '-' ? `${data.subtotals.B}kg` : '-';
        elSubD.textContent = data.subtotals.D !== '-' ? `${data.subtotals.D}kg` : '-';
      }
    }

    function processPayload(data) {
      if (!data) return;
      if (data.type === 'REF_LIGHTS') {
        updateRefLights(data.lights);
      } else {
        updateOverlayData(data);
      }
    }

    const peer = new Peer('openlifter-obs-overlay-sora', {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    });

    peer.on('open', (id) => {
      console.log('[Emi-Overlay] Receiver Peer Live:', id);
    });

    peer.on('connection', (conn) => {
      console.log('[Emi-Overlay] Incoming connection established!');
      elDot.classList.add('connected');

      conn.on('data', (data) => {
        processPayload(data);
      });

      conn.on('close', () => {
        elDot.classList.remove('connected');
      });
    });

    peer.on('error', (err) => {
      console.warn('[Emi-Overlay] PeerJS Error:', err);
    });

    // Local channel listeners (Fallback)
    try {
      const bc = new BroadcastChannel('sheffield-ref-channel');
      bc.onmessage = (e) => processPayload(e.data);
    } catch (e) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'sheffield-ref-payload' && e.newValue) {
        try { processPayload(JSON.parse(e.newValue)); } catch (err) {}
      }
    });
  </script>
</body>
</html>
